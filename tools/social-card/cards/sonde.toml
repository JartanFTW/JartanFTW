layout = "chart"
owner = "Jartan-LLC"
name = "sonde"
headline = "Find an API's real rate limit"
description = "Probes any HTTP API for its rate limits,\nburst ceiling and full-scrape time.\nSafe by default."
chips = ["Sanity", "Sequential", "Burst", "Sweep", "Estimate"]
footer = [{ text = "$ " }, { text = "pip install sonde", style = "fg" }]
icon = "sonde.svg"  # Pinhead Map Icons, CC0

# One illustrative run, consistent with sonde's defaults: the sweep's fastest
# sustainable interval is 0.6s (1.67 req/s); the 0.8 margin makes the safe pace
# 1.33 req/s (0.75s), and 1,470,000 items at 100 per page take 14,700 requests.

[style]
tile-from = "#1b7c83"
tile-to = "#0969da"
accent-from = "#56d4dd"
accent-to = "#58a6ff"
glow = "#0b2530"

[chart]
x_label = "requests per second"
y_label = "requests answered"
log_x = true
points = [[0.125, 100], [0.2, 100], [0.33, 100], [0.5, 100], [0.83, 100], [1.67, 98], [3.33, 40], [6.67, 5]]
x_ticks = [0.125, 0.5, 1.67, 6.67]
y_ticks = [0, 50, 100]
y_max = 100
y_suffix = "%"
zone = { from = 1.67, label = "429 zone" }
marker = { at = 1.33, label = "safe pace", value = "1.33 req/s" }

[run]
command = "sonde asset-owners --total-items 1470000"
steps = [
  { name = "sanity", result = "auth ok · 100 items/page" },
  { name = "sequential", result = "42 OK before first 429" },
  { name = "burst", result = "20 concurrent · 12.4s recovery" },
  { name = "sweep", result = "fastest sustainable 0.6s" },
]
outcome_label = "estimate"
outcome = [{ text = "safe pace " }, { text = "0.75s", style = "accent-text" }, { text = " / request" }]
outcome_detail = [{ text = "full scrape ≈ " }, { text = "3h 04m", style = "fg" }, { text = " · 14,700 requests" }]

[gauge]
max = 3
tick_step = 0.5
value = 1.33
caption = "req/s · safe pace"
bands = [
  { to = 1.33, style = "good" },
  { to = 1.67, style = "warning", label = "ceiling 1.67" },
  { to = 3, style = "critical", label = "429" },
]
