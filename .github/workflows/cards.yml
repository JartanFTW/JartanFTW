name: Update README cards

on:
  schedule:
    - cron: "11 6 * * *" # Daily at 1:11 AM Eastern Time (06:11 UTC)
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.PAT }}

      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=darcula&rank_icon=github
          path: profile/stats.svg
          token: ${{ secrets.PAT }}

      - name: Generate top languages card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&theme=darcula
          path: profile/top-langs.svg
          token: ${{ secrets.PAT }}

      - name: Generate streak card
        run: |
          curl -L "https://streak-stats.demolab.com/?user=${{ github.repository_owner }}&theme=darcula" \
            -o profile/streak.svg

      # A custom social preview gets a new URL on every upload, so the README can't
      # link it statically. Repos without one keep the stable auto-generated URL: the
      # one the API returns carries a hash that changes daily.
      - name: Refresh project preview links
        continue-on-error: true  # a failed lookup must not block the stats cards
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          grep -oE 'href="https://github\.com/[^/"]+/[^/"]+"><img src="[^"]*"' README.md |
            sed -E 's|href="https://github\.com/([^/"]+)/([^/"]+)"><img src="([^"]*)"|\1 \2 \3|' |
            while read -r owner repo current; do
              custom=$(gh api graphql \
                -f query="{ repository(owner: \"$owner\", name: \"$repo\") { usesCustomOpenGraphImage openGraphImageUrl } }" \
                --jq '.data.repository | if .usesCustomOpenGraphImage then .openGraphImageUrl else empty end')
              want=${custom:-https://opengraph.githubassets.com/1/$owner/$repo}
              if [ "$current" != "$want" ]; then
                CURRENT="$current" WANT="$want" perl -i -pe 's/\Q$ENV{CURRENT}\E/$ENV{WANT}/' README.md
                echo "$owner/$repo -> $want"
              fi
            done

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg README.md
          git commit -m "Update README cards" || exit 0
          git push
